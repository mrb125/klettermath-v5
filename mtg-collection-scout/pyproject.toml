[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mtg-collection-scout"
version = "1.0.2"
description = "Findet Magic-the-Gathering-Sammlungen auf Online-Marktplaetzen (eBay, Kleinanzeigen, Ausland) und bewertet sie automatisch."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["magic the gathering", "mtg", "sammlung", "ebay", "kleinanzeigen", "scraper", "bewertung"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Games/Entertainment",
]
dependencies = []          # Kernprogramm: bewusst nur Standardbibliothek

[project.optional-dependencies]
# Nur fuer die Fotoauswertung mit Claude noetig (siehe README, Abschnitt "Fotos auswerten")
fotos = ["anthropic>=1.0"]

[project.scripts]
mtg-scout = "mtg_scout.cli:main"

[project.urls]
Quelltext = "https://github.com/mrb125/klettermath-v5/tree/main/mtg-collection-scout"

[tool.setuptools.packages.find]
# Automatisch finden statt aufzaehlen - eine handgepflegte Liste vergisst
# frueher oder spaeter ein neues Unterpaket (siehe mtg_scout.vision).
include = ["mtg_scout*"]

[tool.setuptools.package-data]
mtg_scout = ["profiles/*.json", "data/*.json"]
